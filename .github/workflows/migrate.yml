name: Migrate database

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

concurrency: migrate-production

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "false"
      # Placeholder: migrations do not sign cookies, but settings require a secret when debug is off.
      DJANGO_SECRET_KEY: migrate-only-placeholder-not-used-for-signing
      # Supabase SESSION pooler URL (port 5432 on the pooler host). Direct connections are IPv6-only.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
